worker_processes auto;

events {
    worker_connections 512;
}

http {
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # ── Upstreams (nombres de servicio de Docker Compose) ──
    upstream usuarios_upstream {
        server usuarios-api:8080;
    }
    upstream admin_upstream {
        server admin-api:8080;
    }
    upstream chat_upstream {
        server chat-api:8080;
    }
    upstream marketplace_upstream {
        server marketplace-api:8080;
    }
    upstream resenas_upstream {
        server resenas-api:8080;
    }

    server {
        listen 8080;
        server_name _;

        # ── Health check del gateway ──
        location /health {
            default_type application/json;
            return 200 '{"status":"healthy","gateway":"nginx"}';
        }

        # ── Usuarios API ──
        # Las rutas del controller son: api/Auth/registro, api/Auth/login, etc.
        location /api/usuarios/ {
            proxy_pass http://usuarios_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        }

        # ── Admin API ──
        location /api/admin/ {
            proxy_pass http://admin_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        }

        # ── Chat SignalR Hub ──
        location /api/chat/hubs/ {
            proxy_pass http://chat_upstream/hubs/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── Chat API ──
        location /api/chat/ {
            proxy_pass http://chat_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        }

        # ── Marketplace API ──
        location /api/marketplace/ {
            proxy_pass http://marketplace_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        }

        # ── Reseñas API ──
        location /api/resenas/ {
            proxy_pass http://resenas_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        }
    }
}
