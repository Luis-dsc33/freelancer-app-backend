name: Deploy .NET Backend to Raspberry Pi

on:
  push:
    branches:
      - main # Cambia esto si tu rama principal tiene otro nombre (ej. master)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Cambia esto a la versión de .NET que utilices (ej. 7.0.x)

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish for Raspberry Pi
        # Utiliza linux-arm64 si tu Raspberry Pi OS es de 64 bits. Usa linux-arm si es de 32 bits.
        run: dotnet publish -c Release -r linux-arm64 --self-contained false -o ./publish

      - name: Copy files to Raspberry Pi via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USERNAME }}
          key: ${{ secrets.PI_SSH_KEY }}
          port: ${{ secrets.PI_PORT || '22' }}
          source: "publish/*"
          target: "/ruta/en/tu/raspberry/pi" # Cambia esto a la ruta de destino en tu Raspberry
          strip_components: 1

      - name: Restart service on Raspberry Pi
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USERNAME }}
          key: ${{ secrets.PI_SSH_KEY }}
          port: ${{ secrets.PI_PORT || '22' }}
          script: |
            # Reiniciar el servicio en segundo plano (Systemd)
            # Cambia 'mi-backend.service' por el nombre real del servicio de tu aplicación
            sudo systemctl restart mi-backend.service
