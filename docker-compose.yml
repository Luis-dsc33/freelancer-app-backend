services:

  # ════════════════════════════════════════════
  # 🐘 PostgreSQL
  # ════════════════════════════════════════════
  postgres:
    image: postgres:17-alpine
    container_name: freelancer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - freelancer-network

  # ════════════════════════════════════════════
  # 👤 Usuarios API
  # ════════════════════════════════════════════
  usuarios-api:
    build:
      context: ./Usuarios
      dockerfile: Dockerfile
    container_name: freelancer-usuarios
    restart: unless-stopped
    environment:
      - ConnectionStrings__DefaultConnection=${USUARIOS_DB_CONNECTION}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__ExpiraMinutos=${JWT_EXPIRA_MINUTOS}
      - Smtp__Host=${SMTP_HOST}
      - Smtp__Port=${SMTP_PORT}
      - Smtp__Username=${SMTP_USERNAME}
      - Smtp__Password=${SMTP_PASSWORD}
      - Smtp__FromEmail=${SMTP_FROM_EMAIL}
      - Smtp__FromName=${SMTP_FROM_NAME}
      - PasswordReset__ResetPageUrl=${PASSWORD_RESET_URL}
      - PasswordReset__ExpiresInMinutes=${PASSWORD_RESET_EXPIRY_MINUTES}
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - freelancer-network

  # ════════════════════════════════════════════
  # 🛡️ Admin API
  # ════════════════════════════════════════════
  admin-api:
    build:
      context: ./Admin
      dockerfile: Dockerfile
    container_name: freelancer-admin
    restart: unless-stopped
    environment:
      - ConnectionStrings__DefaultConnection=${ADMIN_DB_CONNECTION}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - freelancer-network

  # ════════════════════════════════════════════
  # 💬 Chat API
  # ════════════════════════════════════════════
  chat-api:
    build:
      context: ./Chat
      dockerfile: Dockerfile
    container_name: freelancer-chat
    restart: unless-stopped
    environment:
      - ConnectionStrings__DefaultConnection=${CHAT_DB_CONNECTION}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - freelancer-network

  # ════════════════════════════════════════════
  # 🛒 Marketplace API
  # ════════════════════════════════════════════
  marketplace-api:
    build:
      context: ./Marketplace
      dockerfile: Dockerfile
    container_name: freelancer-marketplace
    restart: unless-stopped
    environment:
      - ConnectionStrings__DefaultConnection=${MARKETPLACE_DB_CONNECTION}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - freelancer-network

  # ════════════════════════════════════════════
  # ⭐ Reseñas API
  # ════════════════════════════════════════════
  resenas-api:
    build:
      context: ./Resenas
      dockerfile: Dockerfile
    container_name: freelancer-resenas
    restart: unless-stopped
    environment:
      - ConnectionStrings__DefaultConnection=${RESENAS_DB_CONNECTION}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - freelancer-network

  # ════════════════════════════════════════════
  # 🔀 NGINX API Gateway
  # ════════════════════════════════════════════
  nginx:
    image: nginx:alpine
    container_name: freelancer-gateway
    restart: unless-stopped
    ports:
      - "9080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - usuarios-api
      - admin-api
      - chat-api
      - marketplace-api
      - resenas-api
    networks:
      - freelancer-network

  # ════════════════════════════════════════════
  # ☁️ Cloudflare Tunnel
  # ════════════════════════════════════════════
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: freelancer-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - freelancer-network

volumes:
  postgres_data:
    driver: local

networks:
  freelancer-network:
    driver: bridge
